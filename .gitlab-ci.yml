# GitLab CI auto-deploy holdlens.com to CF Pages on push to main.
# Operator one-time setup: add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# to project Settings > CI/CD > Variables.

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "24"
  # Microsoft Clarity project ID (public client-side identifier, not a secret).
  # Baked into static export at build time; layout.tsx loads Clarity script
  # only when this is set. Project: holdlens (wk6syntdl3).
  NEXT_PUBLIC_CLARITY_ID: "wk6syntdl3"
  # Stripe Payment Links — PUBLIC URLs (not secrets); inlined at build time by
  # components/StripeCheckoutButton.tsx via process.env.NEXT_PUBLIC_*.
  # Without these in CI variables, the GitLab runner's `next build` produces
  # empty strings → live /pricing CTA falls through to /alerts email-capture
  # instead of Stripe Checkout. CF Pages env vars don't help here because the
  # build happens in the GitLab runner before wrangler ships the artifact.
  # Hard-coded mirrors the CLARITY_ID pattern above + the values in
  # .env.production.local. 2026-05-13 fix following 27 days of broken CTA.
  NEXT_PUBLIC_STRIPE_PAYMENT_LINK: "https://buy.stripe.com/9B6eVcavmcspgsSaIJfIs00"
  NEXT_PUBLIC_STRIPE_PAYMENT_LINK_FOUNDERS: "https://buy.stripe.com/3cIfZgcDu9gda4u8ABfIs01"
  # Supabase auth — NEXT_PUBLIC_ keys are PUBLIC by design.
  # The "publishable" key is the modern replacement for legacy "anon" JWT.
  # Both are intentionally exposed to client JS; Row Level Security (RLS)
  # gates actual data access at the Postgres layer. Hardcoding here mirrors
  # the Clarity ID + Stripe Payment Link pattern above. Without these vars
  # at CI-build time, /signup + /login + /account render a "Coming soon"
  # fallback because lib/auth.ts `isAuthConfigured()` returns false on
  # empty env. 2026-05-13 v0.60 ship; operator pasted keys + brain ran
  # SQL migration via Supabase Management API earlier same session.
  NEXT_PUBLIC_SUPABASE_URL: "https://pguombwsbacsupkokjka.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_3L0A5QVO_3TVf_0ceBwx5g_R5i5yso8"

cache:
  # v3 = invalidate when NEXT_PUBLIC_* env-baked vars change.
  # 2026-05-13: bumped from v2 to force fresh build with Supabase auth keys
  # newly inlined above. v2 cache would otherwise serve stale signup/page-*.js
  # chunks compiled without the publishable key embedded.
  key: holdlens-cache-v3
  paths:
    - node_modules/
    - .next/cache/

build:
  stage: build
  image: node:24-bookworm-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
  script:
    - npm ci --no-audit --no-fund
    - rm -rf .next/cache
    - npm run build
    - test -d out
    - test -f out/investor/michael-burry/index.html
    # Verify postbuild generators produced their artifacts (sitemap, llms) + Pivot A compliance holds.
    # HIGH RISK during AdSense review window (submitted 2026-05-08): stale-deploy clobber would surface
    # pre-Pivot-A verdict labels to Google reviewer and flip the review to rejection.
    - node scripts/predeploy-guard.mjs
  artifacts:
    paths:
      - out/
    expire_in: 1 day
  only:
    - main

deploy:
  stage: deploy
  image: node:24-bookworm-slim
  needs:
    - build
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates
    - npm install -g wrangler@4
  script:
    - test -d out
    - test -n "$CLOUDFLARE_API_TOKEN"
    - test -n "$CLOUDFLARE_ACCOUNT_ID"
    # Defensive re-run of guard at deploy stage — catches stale artifacts between build + deploy.
    - node scripts/predeploy-guard.mjs
    - wrangler pages deploy out --project-name holdlens --branch main --commit-dirty=true
  only:
    - main
