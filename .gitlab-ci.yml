# HoldLens production is a Cloudflare Pages static export built and uploaded from
# the canonical main checkout with `npm run deploy` -> scripts/deploy-cf.sh.
# Vercel has not served this project since 2026-07-03. A GitLab push does NOT
# deploy production: this file runs the scheduled EDGAR refresh and validates a
# build only. The production script applies the required pruning/file-cap logic
# and checks the exact artifact after build, immediately before upload.

stages:
  - refresh
  - build

variables:
  NODE_VERSION: "24"
  # Microsoft Clarity project ID (public client-side identifier, not a secret).
  # Baked into static export at build time; layout.tsx loads Clarity script
  # only when this is set. Project: holdlens (wk6syntdl3).
  NEXT_PUBLIC_CLARITY_ID: "wk6syntdl3"
  # GA4 measurement ID (public client-side identifier, not a secret — it is in
  # every served <head>). 2026-09-11: scripts/predeploy-guard.mjs (43386205a)
  # now refuses an out/ built without the GA4 tag, and the runner has no
  # .env.production.local, so main went red on 43386205a + 80093348. Same
  # hard-coded pattern as CLARITY_ID above; mirrors .env.production.local.
  NEXT_PUBLIC_GA4_ID: "G-HDK5CHBQEY"
  # Stripe Payment Links — PUBLIC URLs (not secrets); inlined at build time by
  # components/StripeCheckoutButton.tsx via process.env.NEXT_PUBLIC_*.
  # Without these in CI variables, the GitLab validation build produces empty
  # strings and cannot prove the /pricing CTA. Production is built separately in
  # the canonical main checkout; CF Pages dashboard vars do not reach either
  # static build.
  # Hard-coded mirrors the CLARITY_ID pattern above + the values in
  # .env.production.local. 2026-05-13 fix following 27 days of broken CTA.
  NEXT_PUBLIC_STRIPE_PAYMENT_LINK: "https://buy.stripe.com/9B6eVcavmcspgsSaIJfIs00"
  NEXT_PUBLIC_STRIPE_PAYMENT_LINK_FOUNDERS: "https://buy.stripe.com/3cIfZgcDu9gda4u8ABfIs01"
  # Supabase auth — NEXT_PUBLIC_ keys are PUBLIC by design.
  # The "publishable" key is the modern replacement for legacy "anon" JWT.
  # Both are intentionally exposed to client JS; Row Level Security (RLS)
  # gates actual data access at the Postgres layer. Hardcoding here mirrors
  # the Clarity ID + Stripe Payment Link pattern above. Without these vars
  # at CI-build time, /signup + /login + /account render a "Coming soon"
  # fallback because lib/auth.ts `isAuthConfigured()` returns false on
  # empty env. 2026-05-13 v0.60 ship; operator pasted keys + brain ran
  # SQL migration via Supabase Management API earlier same session.
  NEXT_PUBLIC_SUPABASE_URL: "https://pguombwsbacsupkokjka.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_3L0A5QVO_3TVf_0ceBwx5g_R5i5yso8"

# 2026-09-24 CI-minutes cut: the old cache (node_modules/ + .next/cache/, key
# holdlens-cache-v4) was pure overhead — `npm ci` deletes node_modules/ and the
# build script ran `rm -rf .next/cache`, so ~35 s/run went to restoring and
# re-archiving a cache nothing used. Now only the npm tarball cache is kept,
# keyed on package-lock.json, and `npm ci` reads it with --prefer-offline.
cache:
  key:
    files: [package-lock.json]
  paths:
    - .npm/

build:
  stage: build
  image: node:24-bookworm-slim
  interruptible: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
  script:
    - npm ci --no-audit --no-fund --cache .npm --prefer-offline
    - npm run build
    - test -d out
    - test -f out/investor/michael-burry/index.html
    # Verify postbuild generators produced their artifacts (sitemap, llms) + Pivot A compliance holds.
    # HIGH RISK during AdSense review window (submitted 2026-05-08): stale-deploy clobber would surface
    # pre-Pivot-A verdict labels to Google reviewer and flip the review to rejection.
    - node scripts/predeploy-guard.mjs
  # No `artifacts: out/` any more (2026-09-24): no job downloads it — production is
  # built and uploaded locally by `npm run deploy` — and archiving ~20k files cost
  # ~25 s of runner time per push.
  #
  # PATH FILTER (2026-09-24): the validation build runs only when something that
  # changes the code or build changed. A data-only push (the daily
  # "data(edgar): scheduled ingest" commits, ~13 min each) no longer triggers a
  # full validation build: production is never deployed from CI, and the local
  # `npm run deploy` runs the same build + scripts/predeploy-guard.mjs on the exact
  # artifact before upload, so no data change reaches production unvalidated.
  # .gitlab-ci.yml is listed so a CI change verifies itself.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - .gitlab-ci.yml
        - app/**/*
        - components/**/*
        - lib/**/*
        - functions/**/*
        - workers/**/*
        - scripts/**/*
        - public/**/*
        - next.config.js
        - package.json
        - package-lock.json
        - tsconfig.json
        - tailwind.config.ts
        - postcss.config.js

# Scheduled data refresh — runs ONLY when GitLab scheduled pipeline fires
# (Project Settings > CI/CD > Schedules). Operator one-time:
#   cron: 0 22 * * 1-5  (Mon-Fri 22:00 UTC = ~90 min after US market close)
#   target branch: main
#   variable REFRESH=1 (used by rules: below to gate this job)
#
# What it does:
#   1. Fetch latest 13F filings from SEC EDGAR (~30 tracked managers)
#   2. Fetch latest Form 4 insider trades
#   3. Fetch latest 8-K material events
#   4. Generate daily EOD price snapshot
#   5. Commit data/* changes back to main → triggers the build-validation job.
#      Production remains unchanged until an explicit guarded local deploy.
#
# No production deploy occurs in this pipeline.
refresh:
  stage: refresh
  image: node:24-bookworm-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
    - npm ci --no-audit --no-fund --cache .npm --prefer-offline
  script:
    - echo "=== EDGAR 13F refresh ==="
    - npx tsx scripts/fetch-edgar-13f.ts
    - echo "=== EDGAR Form 4 refresh ==="
    - npx tsx scripts/fetch-edgar-form4.ts
    - echo "=== EDGAR 8-K refresh ==="
    - npx tsx scripts/fetch-edgar-8k.ts
    - echo "=== Daily snapshot ==="
    - npx tsx scripts/generate-daily-snapshot.ts || true
    - echo "=== Commit changes back to main ==="
    - git config user.name "HoldLens Refresh Bot"
    - git config user.email "bot@holdlens.com"
    - git add data/ public/api/v1/daily.json public/api/v1/movers.json 2>/dev/null || true
    - |
      if git diff --cached --quiet; then
        echo "No data changes — skipping commit."
        exit 0
      fi
      git commit -m "chore(refresh): EDGAR + daily snapshot $(date -u +%Y-%m-%d)"
      # Push back using job token + project-access token (operator must add
      # PROJECT_ACCESS_TOKEN with write_repository scope to CI variables).
      git push "https://oauth2:${PROJECT_ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# Production deployment is deliberately absent. Use `npm run deploy` from the
# canonical main checkout; do not add a bare Wrangler upload here because the
# production script owns pruning, the file-cap gate, post-build validation, and
# the chunked uploader.
